<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mayurika</title><link rel="stylesheet" href="./style.css"></head>
<body><main><section class="brain"><canvas id="memory-map" aria-label="Карта событий памяти"></canvas><div class="map-label">MAYURIKA · MEMORY</div></section><section class="panel"><header><h1>Mayurika</h1><span id="status">Подключение…</span></header><p class="hint">Когнитивная память · SOUL CORE · 90 функций — поэтапная разработка</p><div id="messages" aria-live="polite"></div><form id="memory-form"><label for="memory-input">Сохранить заметку в память</label><textarea id="memory-input" maxlength="5000" rows="3" placeholder="Напиши факт или заметку…"></textarea><button type="submit">Сохранить</button></form><form id="search-form"><label for="search-input">Поиск памяти</label><input id="search-input" placeholder="Поиск по сохранённым фактам"><button type="submit">Найти</button></form><div id="results"></div><small>Облачный чат пока не подключён. Новые записи сохраняются как неподтверждённые.</small></section></main><script type="module" src="./app.js"></script></body></html>
